<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>조지훈 · 유희연 결혼 소식</title>
  <meta name="description" content="조지훈과 유희연의 결혼 소식을 전합니다.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF8F5">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">

  <!--
    OG 태그는 크롤러가 JS를 실행하지 않으므로 여기에 직접 적습니다.
    og:image 와 og:url 은 https:// 로 시작하는 절대 주소여야 카카오톡 미리보기에 표시됩니다.
    og-image.jpg 를 바꿀 때는 아래 ?v= 숫자를 올려야 카카오톡 등의 캐시가 갱신됩니다.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="조지훈 · 유희연">
  <meta property="og:title" content="조지훈 · 유희연 결혼 소식">
  <meta property="og:description" content="조지훈과 유희연의 결혼 소식을 전합니다.">
  <meta property="og:image" content="https://jayjo465.github.io/wedding/assets/img/og-image.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="우산 아래에서 웃고 있는 조지훈과 유희연">
  <meta property="og:url" content="https://jayjo465.github.io/wedding/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="조지훈 · 유희연 결혼 소식">
  <meta name="twitter:description" content="조지훈과 유희연의 결혼 소식을 전합니다.">
  <meta name="twitter:image" content="https://jayjo465.github.io/wedding/assets/img/og-image.jpg?v=2">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <main class="page" id="app">
    <noscript>
      <p class="noscript">이 청첩장은 자바스크립트가 켜져 있어야 볼 수 있습니다.</p>
    </noscript>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script src="./assets/js/main.js" defer></script>
</body>
</html>
